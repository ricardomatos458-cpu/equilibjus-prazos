<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EQUILIBJUS Prazos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .mono { font-family: 'Fira Code', monospace; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #f8fafc; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .sidebar-enter { transform: translateX(0) !important; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">

  <!-- ── Sidebar overlay (mobile) ────────────────────── -->
  <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-40 z-20 hidden" onclick="closeSidebar()"></div>

  <!-- ── Sidebar ──────────────────────────────────────── -->
  <aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-white border-r border-gray-200 z-30 flex flex-col"
         style="transform: translateX(-100%); transition: transform 0.3s ease;">
    <!-- Brand -->
    <div class="px-5 py-5 border-b border-gray-100">
      <div class="text-blue-600 font-bold text-lg tracking-widest">EQUILIBJUS</div>
      <div class="text-gray-400 text-xs mt-0.5 mono">prazos-processuais</div>
    </div>

    <!-- Nav -->
    <nav class="flex-1 p-3 space-y-0.5 overflow-y-auto">
      <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-blue-50 text-blue-700 font-semibold text-sm">
        <svg class="w-4.5 h-4.5 flex-shrink-0 w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
        Prazos Processuais
      </a>
    </nav>

    <!-- Footer sidebar -->
    <div class="p-4 border-t border-gray-100">
      <div class="text-xs text-gray-400 mono">v1.0.0</div>
    </div>
  </aside>

  <!-- ── Main wrapper ──────────────────────────────────── -->
  <div id="main-wrap" class="min-h-screen flex flex-col" style="margin-left: 0; transition: margin-left 0.3s ease;">

    <!-- ── Topbar ──────────────────────────────────────── -->
    <header class="sticky top-0 z-10 bg-white border-b border-gray-200 px-4 py-3 flex items-center gap-3">
      <!-- Hamburger -->
      <button id="hamburger" onclick="toggleSidebar()" class="p-2 rounded-lg hover:bg-gray-100 text-gray-500 transition flex-shrink-0">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>

      <!-- Page title -->
      <div class="font-semibold text-gray-900 text-sm mr-auto">Prazos Processuais</div>

      <!-- Search (desktop) -->

        <svg class="w-4 h-4 text-gray-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input id="search" type="text" placeholder="Cliente ou processo..."
               class="bg-transparent text-sm outline-none text-gray-700 placeholder-gray-400 w-full"
               oninput="onSearch(this.value)">
      </div>

      <!-- New prazo button -->
      <button onclick="openModal()"
              class="flex items-center gap-2 bg-blue-600 text-white text-sm font-bold px-4 py-2 rounded-lg hover:bg-blue-700 transition-transform transform hover:scale-105 flex-shrink-0">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
        </svg>
        <span class="hidden sm:inline">Novo Prazo</span>
      </button>
    </header>

    <!-- ── Content ─────────────────────────────────────── -->
    <main class="flex-1 p-4 lg:p-6 space-y-4">

      <!-- Search (mobile) -->
      <div class="sm:hidden flex items-center bg-white border border-gray-200 rounded-lg px-3 py-2.5 gap-2 shadow-sm focus-within:border-blue-400 focus-within:ring-2 focus-within:ring-blue-100 transition">
        <svg class="w-4 h-4 text-gray-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input type="text" placeholder="Buscar por cliente ou processo..."

               oninput="document.getElementById('search').value=this.value; onSearch(this.value)">
      </div>

      <!-- Metrics -->
      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3">

        <div class="metric-card bg-white rounded-xl border border-gray-200 shadow-sm p-4 cursor-pointer hover:shadow-md transition select-none"

          <div id="cnt-fatal" class="text-3xl font-bold mono text-red-600">-</div>
        </div>

        <div class="metric-card bg-white rounded-xl border border-gray-200 shadow-sm p-4 cursor-pointer hover:shadow-md transition select-none"

          <div class="text-xs font-semibold uppercase tracking-widest text-gray-400 mb-2">Critico</div>
          <div id="cnt-critico" class="text-3xl font-bold mono text-red-500">-</div>
        </div>

        <div class="metric-card bg-white rounded-xl border border-gray-200 shadow-sm p-4 cursor-pointer hover:shadow-md transition select-none"
             data-nivel="atencao" onclick="clickMetric('atencao')">
          <div class="text-xs font-semibold uppercase tracking-widest text-gray-400 mb-2">Atencao</div>
          <div id="cnt-atencao" class="text-3xl font-bold mono text-orange-500">-</div>
        </div>

        <div class="metric-card bg-white rounded-xl border border-gray-200 shadow-sm p-4 cursor-pointer hover:shadow-md transition select-none"
             data-nivel="no_prazo" onclick="clickMetric('no_prazo')">
          <div class="text-xs font-semibold uppercase tracking-widest text-gray-400 mb-2">No Prazo</div>
          <div id="cnt-no_prazo" class="text-3xl font-bold mono text-blue-600">-</div>
        </div>

        <div class="metric-card bg-white rounded-xl border border-gray-200 shadow-sm p-4 cursor-pointer hover:shadow-md transition select-none col-span-2 md:col-span-1"
             data-nivel="aguardando" onclick="clickMetric('aguardando')">
          <div class="text-xs font-semibold uppercase tracking-widest text-gray-400 mb-2">Aguardando</div>
          <div id="cnt-aguardando" class="text-3xl font-bold mono text-gray-400">-</div>
        </div>

      </div>

      <!-- Filters card -->
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-4 space-y-3">

        <!-- Urgency -->
        <div class="flex items-start gap-3 flex-wrap">
          <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider pt-1.5 w-20 flex-shrink-0">Urgencia</span>
          <div id="fg-nivel" class="flex gap-1.5 flex-wrap">
            <button data-v="todos"      onclick="setNivel('todos')"      class="px-3 py-1.5 text-xs font-semibold rounded-lg border transition">Todos</button>
            <button data-v="fatal"      onclick="setNivel('fatal')"      class="px-3 py-1.5 text-xs font-semibold rounded-lg border transition">Fatal</button>
            <button data-v="critico"    onclick="setNivel('critico')"    class="px-3 py-1.5 text-xs font-semibold rounded-lg border transition">Critico</button>
            <button data-v="atencao"    onclick="setNivel('atencao')"    class="px-3 py-1.5 text-xs font-semibold rounded-lg border transition">Atencao</button>
            <button data-v="no_prazo"   onclick="setNivel('no_prazo')"   class="px-3 py-1.5 text-xs font-semibold rounded-lg border transition">No Prazo</button>
            <button data-v="aguardando" onclick="setNivel('aguardando')" class="px-3 py-1.5 text-xs font-semibold rounded-lg border transition">Aguardando</button>
          </div>
        </div>

        <!-- Divider -->
        <div class="border-t border-gray-100"></div>

        <!-- Lawyer + toggle -->
        <div class="flex items-center gap-3 flex-wrap">
          <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider w-20 flex-shrink-0">Advogado</span>
          <div id="fg-adv" class="flex gap-1.5 flex-wrap flex-1">
            <button data-v="todos"   onclick="setAdv('todos')"   class="px-3 py-1.5 text-xs font-semibold rounded-lg border transition">Todos</button>
            <button data-v="Ricardo" onclick="setAdv('Ricardo')" class="px-3 py-1.5 text-xs font-semibold rounded-lg border transition">Ricardo</button>
            <button data-v="Athos"   onclick="setAdv('Athos')"   class="px-3 py-1.5 text-xs font-semibold rounded-lg border transition">Athos</button>
            <button data-v="Romulo"  onclick="setAdv('Romulo')"  class="px-3 py-1.5 text-xs font-semibold rounded-lg border transition">Romulo</button>
          </div>
          <label class="flex items-center gap-2 cursor-pointer ml-auto flex-shrink-0">
            <span class="text-xs text-gray-500 font-medium">Mostrar concluidos</span>

            </div>
          </label>
        </div>

      </div>

      <!-- Table -->
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="bg-gray-50 border-b border-gray-200">
                <th class="text-left px-4 py-3 text-xs font-semibold uppercase tracking-wider text-gray-500 whitespace-nowrap">Cliente</th>
                <th class="text-left px-4 py-3 text-xs font-semibold uppercase tracking-wider text-gray-500 whitespace-nowrap">Processo</th>
                <th class="text-left px-4 py-3 text-xs font-semibold uppercase tracking-wider text-gray-500 whitespace-nowrap hidden md:table-cell">Sistema</th>
                <th class="text-left px-4 py-3 text-xs font-semibold uppercase tracking-wider text-gray-500 whitespace-nowrap hidden lg:table-cell">Instancia</th>
                <th class="text-left px-4 py-3 text-xs font-semibold uppercase tracking-wider text-gray-500 whitespace-nowrap hidden lg:table-cell">Tipo</th>
                <th class="text-left px-4 py-3 text-xs font-semibold uppercase tracking-wider text-gray-500 whitespace-nowrap">Vencimento</th>
                <th class="text-left px-4 py-3 text-xs font-semibold uppercase tracking-wider text-gray-500 whitespace-nowrap hidden md:table-cell">Responsavel</th>
                <th class="text-left px-4 py-3 text-xs font-semibold uppercase tracking-wider text-gray-500 whitespace-nowrap">Urgencia</th>
                <th class="px-4 py-3 w-24"></th>

            <tbody id="tbody">

                <td colspan="9" class="px-4 py-16 text-center text-gray-400 text-sm">Carregando...</td>

      </div>

    </main>

  <!-- ── Modal ──────────────────────────────────────────── -->
  <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden items-center justify-center p-4"
       onclick="overlayClick(event)">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] flex flex-col animate-fadeIn">

      <div class="px-6 pt-5 pb-4 border-b border-gray-100 flex items-center justify-between">
        <h2 class="text-lg font-bold text-gray-900">Novo Prazo</h2>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-700 transition p-1.5 rounded-lg hover:bg-gray-100">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>

      </div>

      <div class="p-6 overflow-y-auto flex-1 space-y-4">
        <div class="grid grid-cols-2 gap-4">

          <div>

              <option value="">Selecionar</option>

              <option>Contestacao</option>

              <option>Impugnacao</option>
              <option>Replica</option>
              <option>Memoriais</option>
              <option>Sustentacao Oral</option>

              <option>Decisao</option>

            <input type="date" id="f-vencimento"

          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1.5">Responsavel</label>
            <select id="f-login" class="w-full p-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm outline-none transition bg-white">
              <option value="">Selecionar</option>
              <option value="Ricardo">Ricardo</option>
              <option value="Athos">Athos</option>
              <option value="Romulo">Romulo</option>
              <option value="Athos e Rômulo">Athos e Romulo</option>

          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1.5">Urgencia</label>
            <select id="f-nivel" class="w-full p-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm outline-none transition bg-white">

      <div class="px-6 py-4 border-t border-gray-100 flex justify-end gap-3">
        <button onclick="closeModal()"
                class="px-4 py-2 text-sm font-semibold text-gray-600 border border-gray-200 rounded-lg hover:bg-gray-50 transition">
          Cancelar
        </button>
        <button id="btn-save" onclick="submitForm()"
                class="px-6 py-2 text-sm font-bold bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-transform transform hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none">
          Salvar Prazo

  <!-- ── Toast ──────────────────────────────────────────── -->
  <div id="toast" role="alert" aria-live="polite"
       class="fixed bottom-6 right-6 z-50 px-4 py-3 rounded-xl shadow-lg text-sm font-medium max-w-xs pointer-events-none
              opacity-0 translate-y-2 transition-all duration-300">
  </div>

  <!-- ── Supabase ───────────────────────────────────────── -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    'use strict';

    // ============================================================
    // CONFIGURACAO — edite as constantes abaixo conforme necessario
    // ============================================================
    const SUPABASE_URL      = 'https://nuelqfvnjacnbctodreg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_rlgOc-_O890oEgzVjInQZg_ep4fmqbO';
    // ============================================================

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ── Estado ──────────────────────────────────────────────────
    let rows      = [];
    let fNivel    = 'todos';
    let fAdv      = 'todos';
    let searchStr = '';
    let showConc  = false;

    // ── Urgencia ─────────────────────────────────────────────────
    function calcNivel(p) {
      if (p.nivel === 'aguardando') return 'aguardando';
      if (!p.vencimento)            return 'aguardando';
      const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
      const venc = new Date(p.vencimento + 'T00:00:00');
      const d    = Math.floor((venc - hoje) / 86400000);
      if (d < 0)  return 'fatal';
      if (d <= 2) return 'critico';
      if (d <= 5) return 'atencao';
      return 'no_prazo';
    }

    const NIVEL_LABEL = { fatal:'Fatal', critico:'Critico', atencao:'Atencao', no_prazo:'No Prazo', aguardando:'Aguardando' };

    // Badge classes por nivel
    const BADGE_CLASS = {
      fatal:      'bg-red-100 text-red-700 border border-red-200',
      critico:    'bg-red-50  text-red-600 border border-red-200',
      atencao:    'bg-orange-100 text-orange-700 border border-orange-200',
      no_prazo:   'bg-blue-100 text-blue-700 border border-blue-200',
      aguardando: 'bg-gray-100 text-gray-500 border border-gray-200',
    };

    // Vencimento text color por nivel
    const VENC_COLOR = {
      fatal:      'text-red-600 font-semibold',
      critico:    'text-red-500 font-semibold',
      atencao:    'text-orange-600 font-semibold',
      no_prazo:   'text-blue-600',
      aguardando: 'text-gray-400',
    };

    function deltaLabel(p) {
      if (!p.vencimento || p.nivel === 'aguardando') return '';
      const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
      const venc = new Date(p.vencimento + 'T00:00:00');
      const d    = Math.floor((venc - hoje) / 86400000);
      if (d < 0)   return Math.abs(d) + 'd atrasado';
      if (d === 0) return 'hoje';
      if (d === 1) return 'amanha';
      return d + 'd restantes';
    }

    function fmtDate(iso) {
      if (!iso) return '-';
      const [y, m, d] = iso.split('-');
      return d + '/' + m + '/' + y;
    }

    // ── Supabase — ler ────────────────────────────────────────────
    async function loadRows() {
      try {
        let q = db.from('prazos').select('*').order('vencimento', { ascending: true, nullsFirst: false });
        if (!showConc) q = q.or('concluido.is.null,concluido.eq.false');
        const { data, error } = await q;
        if (error) throw error;
        rows = data || [];
        render();
      } catch (e) {
        console.error(e);
        toast('Erro ao carregar dados: ' + e.message, 'err');
        document.getElementById('tbody').innerHTML =
          `<tr><td colspan="9" class="px-4 py-12 text-center text-red-500 text-sm">${esc(e.message)}</td></tr>`;
      }
    }

    // ── Supabase — inserir ────────────────────────────────────────
    async function insertRow(payload) {
      const { error } = await db.from('prazos').insert([payload]);
      if (error) throw error;
    }

    // ── Supabase — concluir ───────────────────────────────────────
    async function markDone(id) {
      const { error } = await db.from('prazos').update({ concluido: true }).eq('id', id);
      if (error) throw error;
    }

    // ── Filtros ──────────────────────────────────────────────────
    function filtered() {
      return rows.filter(p => {
        const n = calcNivel(p);
        if (fNivel !== 'todos' && n !== fNivel) return false;
        if (fAdv !== 'todos') {
          const login = (p.login || '').toLowerCase();
          const match = login.includes(fAdv.toLowerCase()) || login === 'todos';
          if (!match) return false;
        }
        if (searchStr) {
          const t = searchStr.toLowerCase();
          if (!(p.cliente || '').toLowerCase().includes(t) &&
              !(p.processo || '').toLowerCase().includes(t)) return false;
        }
        return true;
      });
    }

    // ── Render metricas ───────────────────────────────────────────
    function renderMetrics() {
      const base   = rows.filter(p => !p.concluido);
      const counts = { fatal:0, critico:0, atencao:0, no_prazo:0, aguardando:0 };
      base.forEach(p => { const n = calcNivel(p); if (n in counts) counts[n]++; });
      for (const [k, v] of Object.entries(counts)) {
        const el = document.getElementById('cnt-' + k);
        if (el) el.textContent = v;
      }
    }

    // ── Render tabela ─────────────────────────────────────────────
    function renderTable() {
      const data  = filtered();
      const tbody = document.getElementById('tbody');

      if (!data.length) {
        tbody.innerHTML = `
          <tr>
            <td colspan="9" class="px-4 py-16 text-center">
              <p class="text-gray-700 font-medium mb-1">Nenhum prazo encontrado</p>
              <p class="text-gray-400 text-sm">Ajuste os filtros ou adicione um novo prazo.</p>
            </td>
          </tr>`;
        return;
      }

      tbody.innerHTML = data.map(p => {
        const n     = calcNivel(p);
        const delta = deltaLabel(p);
        const done  = !!p.concluido;
        const rowBg = done ? 'bg-gray-50 opacity-60' : 'hover:bg-gray-50';
        return `
          <tr class="${rowBg} transition-colors border-b border-gray-100 last:border-0">
            <td class="px-4 py-3 font-medium text-gray-900 whitespace-nowrap max-w-[180px] truncate">${esc(p.cliente || '-')}</td>
            <td class="px-4 py-3 mono text-xs text-gray-500 whitespace-nowrap">${esc(p.processo || '-')}</td>
            <td class="px-4 py-3 text-gray-500 text-xs whitespace-nowrap hidden md:table-cell">${esc(p.sistema || '-')}</td>
            <td class="px-4 py-3 text-gray-500 text-xs whitespace-nowrap hidden lg:table-cell">${esc(p.instancia || '-')}</td>
            <td class="px-4 py-3 text-gray-500 text-xs whitespace-nowrap hidden lg:table-cell max-w-[160px] truncate">${esc(p.tipo || '-')}</td>
            <td class="px-4 py-3 whitespace-nowrap">
              <span class="block mono text-sm ${VENC_COLOR[n]}">${fmtDate(p.vencimento)}</span>
              ${delta ? `<span class="block mono text-xs text-gray-400 mt-0.5">${delta}</span>` : ''}
            </td>
            <td class="px-4 py-3 text-gray-500 text-xs whitespace-nowrap hidden md:table-cell">${esc(p.login || '-')}</td>
            <td class="px-4 py-3">
              <span class="inline-block px-2 py-0.5 rounded-md text-xs font-semibold mono ${BADGE_CLASS[n]}">
                ${NIVEL_LABEL[n] || n}
              </span>
            </td>
            <td class="px-4 py-3 text-right">
              ${done
                ? `<span class="inline-flex items-center gap-1 text-xs font-semibold text-green-600">
                     <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                       <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
                     </svg>
                     Concluido
                   </span>`
                : `<button onclick="handleConcluir('${esc(p.id)}')"
                           class="text-xs font-semibold text-gray-500 border border-gray-200 px-3 py-1.5 rounded-lg
                                  hover:border-green-400 hover:text-green-600 hover:bg-green-50 transition whitespace-nowrap">
                     Concluir
                   </button>`
              }
            </td>
          </tr>`;
      }).join('');
    }

    function render() {
      renderMetrics();
      renderTable();
      syncFilterButtons();
    }

    // ── Sync visual dos botoes de filtro ──────────────────────────
    const ACTIVE_CLASSES = {
      todos:      'bg-blue-600 border-blue-600 text-white',
      fatal:      'bg-red-600  border-red-600  text-white',
      critico:    'bg-red-500  border-red-500  text-white',
      atencao:    'bg-orange-500 border-orange-500 text-white',
      no_prazo:   'bg-blue-600 border-blue-600 text-white',
      aguardando: 'bg-gray-500 border-gray-500 text-white',
    };
    const INACTIVE = 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50';

    function syncFilterButtons() {
      document.querySelectorAll('#fg-nivel button').forEach(b => {
        const on = b.dataset.v === fNivel;
        b.className = `px-3 py-1.5 text-xs font-semibold rounded-lg border transition ${on ? ACTIVE_CLASSES[b.dataset.v] : INACTIVE}`;
      });
      document.querySelectorAll('#fg-adv button').forEach(b => {
        const on = b.dataset.v === fAdv;
        b.className = `px-3 py-1.5 text-xs font-semibold rounded-lg border transition ${on ? ACTIVE_CLASSES.todos : INACTIVE}`;
      });
      // Metric cards ring
      document.querySelectorAll('.metric-card').forEach(c => {
        const on = c.dataset.nivel === fNivel;
        c.classList.toggle('ring-2', on);
        c.classList.toggle('ring-blue-400', on && !['fatal','critico','atencao','aguardando'].includes(fNivel));
        c.classList.toggle('ring-red-400',  on && ['fatal','critico'].includes(fNivel));
        c.classList.toggle('ring-orange-400', on && fNivel === 'atencao');
        c.classList.toggle('ring-gray-300',   on && fNivel === 'aguardando');
      });
    }

    // ── Handlers ────────────────────────────────────────────────
    function setNivel(v) { fNivel = v; syncFilterButtons(); renderTable(); }
    function setAdv(v)   { fAdv   = v; syncFilterButtons(); renderTable(); }
    function clickMetric(nivel) { setNivel(fNivel === nivel ? 'todos' : nivel); }
    function onSearch(v) { searchStr = v; renderTable(); }

    async function onToggleConc() {
      showConc = document.getElementById('tog-conc').checked;
      await loadRows();
    }

    async function handleConcluir(id) {
      try {
        await markDone(id);
        toast('Prazo marcado como concluido.', 'ok');
        await loadRows();
      } catch (e) {
        toast('Erro ao concluir prazo: ' + e.message, 'err');
      }
    }

    // ── Modal ────────────────────────────────────────────────────
    function openModal() {
      const el = document.getElementById('overlay');
      el.classList.remove('hidden');
      el.classList.add('flex');
      document.getElementById('f-cliente').focus();
    }

    function closeModal() {
      const el = document.getElementById('overlay');
      el.classList.add('hidden');
      el.classList.remove('flex');
      ['f-cliente','f-processo','f-vencimento'].forEach(id => (document.getElementById(id).value = ''));
      ['f-sistema','f-instancia','f-tipo','f-login','f-nivel'].forEach(id => (document.getElementById(id).selectedIndex = 0));
    }

    function overlayClick(e) { if (e.target === document.getElementById('overlay')) closeModal(); }

    async function submitForm() {
      const cliente  = document.getElementById('f-cliente').value.trim();
      const processo = document.getElementById('f-processo').value.trim();
      if (!cliente || !processo) { toast('Cliente e processo sao obrigatorios.', 'err'); return; }

      const btn = document.getElementById('btn-save');
      btn.disabled = true; btn.textContent = 'Salvando...';

      try {
        await insertRow({
          cliente,
          processo,
          sistema:   document.getElementById('f-sistema').value   || null,
          instancia: document.getElementById('f-instancia').value || null,
          tipo:      document.getElementById('f-tipo').value      || null,
          vencimento:document.getElementById('f-vencimento').value || null,
          login:     document.getElementById('f-login').value     || null,
          nivel:     document.getElementById('f-nivel').value     || null,
          concluido: false,
        });
        toast('Prazo salvo com sucesso.', 'ok');
        closeModal();
        await loadRows();
      } catch (e) {
        toast('Erro ao salvar: ' + e.message, 'err');
      } finally {
        btn.disabled = false; btn.textContent = 'Salvar Prazo';
      }
    }

    // ── Sidebar toggle ───────────────────────────────────────────
    let sidebarOpen = false;

    function toggleSidebar() { sidebarOpen ? closeSidebar() : openSidebar(); }

    function openSidebar() {
      sidebarOpen = true;
      document.getElementById('sidebar').style.transform = 'translateX(0)';
      document.getElementById('sidebar-overlay').classList.remove('hidden');
      document.getElementById('main-wrap').style.marginLeft = window.innerWidth >= 1024 ? '256px' : '0';
    }

    function closeSidebar() {
      sidebarOpen = false;
      document.getElementById('sidebar').style.transform = 'translateX(-100%)';
      document.getElementById('sidebar-overlay').classList.add('hidden');
      document.getElementById('main-wrap').style.marginLeft = '0';
    }

    // On desktop, open sidebar by default
    function initSidebar() {
      if (window.innerWidth >= 1024) {
        document.getElementById('sidebar').style.transform = 'translateX(0)';
        document.getElementById('main-wrap').style.marginLeft = '256px';
        sidebarOpen = true;
      }
    }

    window.addEventListener('resize', () => {
      if (window.innerWidth >= 1024 && !sidebarOpen) openSidebar();
      if (window.innerWidth < 1024  &&  sidebarOpen) closeSidebar();
    });

    // ── Toast ────────────────────────────────────────────────────
    let _tt;
    function toast(msg, type = 'ok') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = `fixed bottom-6 right-6 z-50 px-4 py-3 rounded-xl shadow-lg text-sm font-medium max-w-xs pointer-events-none
        opacity-100 translate-y-0 transition-all duration-300
        ${type === 'ok'
          ? 'bg-white border border-green-200 text-green-700 border-l-4 border-l-green-500'
          : 'bg-white border border-red-200 text-red-700 border-l-4 border-l-red-500'}`;
      clearTimeout(_tt);
      _tt = setTimeout(() => {
        el.className = el.className.replace('opacity-100 translate-y-0', 'opacity-0 translate-y-2');
      }, 3200);
    }

    // ── Util ─────────────────────────────────────────────────────
    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── Keyboard ─────────────────────────────────────────────────
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    // ── Boot ─────────────────────────────────────────────────────
    initSidebar();
    syncFilterButtons();
    loadRows();
  </script>
</body>
</html>
