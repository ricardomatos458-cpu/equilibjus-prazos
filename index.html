  <!-- ── Supabase SDK ── -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    'use strict';

    // ============================================================
    // CONFIGURACAO — edite as constantes abaixo conforme necessario
    // ============================================================
    const SUPABASE_URL      = 'https://nuelqfvnjacnbctodreg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_rlgOc-_O890oEgzVjInQZg_ep4fmqbO';
    // ============================================================

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ── Estado ──────────────────────────────────────────────────
    let rows      = [];
    let fNivel    = 'todos';
    let fAdv      = 'todos';
    let searchStr = '';
    let showConc  = false;

    // ── Calculo de urgencia ──────────────────────────────────────
    function calcNivel(p) {
      if (p.nivel === 'aguardando') return 'aguardando';
      if (!p.vencimento)            return 'aguardando';
      const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
      const venc = new Date(p.vencimento + 'T00:00:00');
      const d    = Math.floor((venc - hoje) / 86400000);
      if (d < 0)  return 'fatal';
      if (d <= 2) return 'critico';
      if (d <= 5) return 'atencao';
      return 'no_prazo';
    }

    const NIVEL_LABEL = {
      fatal:'Fatal', critico:'Critico', atencao:'Atencao',
      no_prazo:'No Prazo', aguardando:'Aguardando'
    };

    // Badges — referencia: p-4 border rounded-lg hover:bg-gray-100 hover:border-blue-500
    // adaptado para badges inline com cor por urgencia
    const BADGE = {
      fatal:      'border border-red-300 bg-red-50 text-red-700',
      critico:    'border border-red-200 bg-red-50 text-red-600',
      atencao:    'border border-orange-300 bg-orange-50 text-orange-700',
      no_prazo:   'border border-blue-300 bg-blue-50 text-blue-700',
      aguardando: 'border border-gray-200 bg-gray-50 text-gray-500',
    };

    const VENC_COLOR = {
      fatal:      'text-red-600 font-bold',
      critico:    'text-red-500 font-semibold',
      atencao:    'text-orange-600 font-semibold',
      no_prazo:   'text-blue-600',
      aguardando: 'text-gray-400',
    };

    function deltaLabel(p) {
      if (!p.vencimento || p.nivel === 'aguardando') return '';
      const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
      const venc = new Date(p.vencimento + 'T00:00:00');
      const d    = Math.floor((venc - hoje) / 86400000);
      if (d < 0)   return Math.abs(d) + 'd atrasado';
      if (d === 0) return 'hoje';
      if (d === 1) return 'amanha';
      return d + 'd restantes';
    }

    function fmtDate(iso) {
      if (!iso) return '-';
      const [y, m, d] = iso.split('-');
      return d + '/' + m + '/' + y;
    }

    // ── loadRows ─────────────────────────────────────────────────
    async function loadRows() {
      try {
        let q = db.from('prazos').select('*')
                  .order('vencimento', { ascending: true, nullsFirst: false });
        if (!showConc) q = q.or('concluido.is.null,concluido.eq.false');
        const { data, error } = await q;
        if (error) throw error;
        rows = data || [];
        render();
      } catch (e) {
        console.error(e);
        toast('Erro ao carregar dados: ' + e.message, 'err');
        document.getElementById('tbody').innerHTML =
          `<tr><td colspan="9" class="px-4 py-12 text-center text-red-500 text-sm">${esc(e.message)}</td></tr>`;
      }
    }

    // ── insertRow ────────────────────────────────────────────────
    async function insertRow(payload) {
      const { error } = await db.from('prazos').insert([payload]);
      if (error) throw error;
    }

    // ── markDone ─────────────────────────────────────────────────
    async function markDone(id) {
      const { error } = await db.from('prazos').update({ concluido: true }).eq('id', id);
      if (error) throw error;
    }

    // ── Filtros ──────────────────────────────────────────────────
    function filtered() {
      return rows.filter(p => {
        const n = calcNivel(p);
        if (fNivel !== 'todos' && n !== fNivel) return false;
        if (fAdv !== 'todos') {
          const login = (p.login || '').toLowerCase();
          if (!login.includes(fAdv.toLowerCase()) && login !== 'todos') return false;
        }
        if (searchStr) {
          const t = searchStr.toLowerCase();
          if (!(p.cliente  || '').toLowerCase().includes(t) &&
              !(p.processo || '').toLowerCase().includes(t)) return false;
        }
        return true;
      });
    }

    // ── Render metricas ───────────────────────────────────────────
    function renderMetrics() {
      const base   = rows.filter(p => !p.concluido);
      const counts = { fatal:0, critico:0, atencao:0, no_prazo:0, aguardando:0 };
      base.forEach(p => { const n = calcNivel(p); if (n in counts) counts[n]++; });
      for (const [k, v] of Object.entries(counts)) {
        const el = document.getElementById('cnt-' + k);
        if (el) el.textContent = v;
      }
    }

    // ── Render tabela ─────────────────────────────────────────────
    function renderTable() {
      const data  = filtered();
      const tbody = document.getElementById('tbody');
      if (!data.length) {
        tbody.innerHTML = `
          <tr>
            <td colspan="9" class="px-4 py-16 text-center">
              <p class="font-medium text-gray-700 mb-1">Nenhum prazo encontrado</p>
              <p class="text-sm text-gray-400">Ajuste os filtros ou adicione um novo prazo.</p>
            </td>
          </tr>`;
        return;
      }
      tbody.innerHTML = data.map(p => {
        const n     = calcNivel(p);
        const delta = deltaLabel(p);
        const done  = !!p.concluido;
        return `
          <tr class="${done ? 'opacity-50' : 'hover:bg-gray-100'} transition border-b border-gray-100 last:border-0">
            <td class="px-4 py-3 font-medium text-gray-900 whitespace-nowrap max-w-xs truncate">${esc(p.cliente || '-')}</td>
            <td class="px-4 py-3 mono text-xs text-gray-500 whitespace-nowrap">${esc(p.processo || '-')}</td>
            <td class="px-4 py-3 text-sm text-gray-500 whitespace-nowrap hidden md:table-cell">${esc(p.sistema || '-')}</td>
            <td class="px-4 py-3 text-sm text-gray-500 whitespace-nowrap hidden lg:table-cell">${esc(p.instancia || '-')}</td>
            <td class="px-4 py-3 text-sm text-gray-500 whitespace-nowrap hidden lg:table-cell max-w-[180px] truncate">${esc(p.tipo || '-')}</td>
            <td class="px-4 py-3 whitespace-nowrap">
              <span class="block mono text-sm ${VENC_COLOR[n]}">${fmtDate(p.vencimento)}</span>
              ${delta ? `<span class="block mono text-xs text-gray-400">${delta}</span>` : ''}
            </td>
            <td class="px-4 py-3 text-sm text-gray-500 whitespace-nowrap hidden md:table-cell">${esc(p.login || '-')}</td>
            <td class="px-4 py-3 whitespace-nowrap">
              <span class="inline-block px-2.5 py-0.5 rounded-md text-xs font-semibold mono ${BADGE[n]}">
                ${NIVEL_LABEL[n]}
              </span>
            </td>
            <td class="px-4 py-3 text-right whitespace-nowrap">
              ${done
                ? `<span class="text-xs font-semibold text-green-600 flex items-center gap-1 justify-end">
                     <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                       <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
                     </svg>Concluido
                   </span>`
                : `<button onclick="handleConcluir('${esc(p.id)}')"
                           class="text-sm text-gray-600 border border-gray-200 px-3 py-1.5 rounded-lg
                                  hover:bg-gray-100 hover:border-blue-500 hover:text-blue-600 transition">
                     Concluir
                   </button>`
              }
            </td>
          </tr>`;
      }).join('');
    }

    function render() { renderMetrics(); renderTable(); syncBtns(); }

    // ── Sync botoes de filtro ─────────────────────────────────────
    // Ativo: bg-blue-600 text-white (referencia: botao primario do arquivo base)
    // Inativo: p-4 border rounded-lg hover:bg-gray-100 hover:border-blue-500 (referencia: choice-btn)
    const ACTIVE_BTN  = 'bg-blue-600 text-white border-blue-600 font-bold';
    const INATIVE_BTN = 'bg-white text-gray-600 border-gray-200 hover:bg-gray-100 hover:border-blue-500';

    function syncBtns() {
      document.querySelectorAll('#fg-nivel button').forEach(b => {
        const on = b.dataset.v === fNivel;
        b.className = `fbtn p-2 px-4 border rounded-lg text-sm transition ${on ? ACTIVE_BTN : INATIVE_BTN}`;
      });
      document.querySelectorAll('#fg-adv button').forEach(b => {
        const on = b.dataset.v === fAdv;
        b.className = `fbtn p-2 px-4 border rounded-lg text-sm transition ${on ? ACTIVE_BTN : INATIVE_BTN}`;
      });
      document.querySelectorAll('.metric-card').forEach(c => {
        const on = c.dataset.nivel === fNivel;
        if (on) {
          c.classList.add('border-blue-500', 'bg-blue-50');
          c.classList.remove('border-gray-200');
        } else {
          c.classList.remove('border-blue-500', 'bg-blue-50');
          c.classList.add('border-gray-200');
        }
      });
    }

    // ── Handlers ─────────────────────────────────────────────────
    function setNivel(v) { fNivel = v; syncBtns(); renderTable(); }
    function setAdv(v)   { fAdv   = v; syncBtns(); renderTable(); }
    function clickMetric(nivel) { setNivel(fNivel === nivel ? 'todos' : nivel); }
    function onSearch(v) { searchStr = v; renderTable(); }

    async function onToggleConc() {
      showConc = document.getElementById('tog-conc').checked;
      await loadRows();
    }

    async function handleConcluir(id) {
      try {
        await markDone(id);
        toast('Prazo marcado como concluido.', 'ok');
        await loadRows();
      } catch (e) {
        toast('Erro ao concluir: ' + e.message, 'err');
      }
    }

    // ── Modal ────────────────────────────────────────────────────
    function openModal() {
      const el = document.getElementById('overlay');
      el.classList.remove('hidden');
      el.classList.add('flex');
      document.getElementById('f-cliente').focus();
    }

    function closeModal() {
      document.getElementById('overlay').classList.add('hidden');
      document.getElementById('overlay').classList.remove('flex');
      ['f-cliente','f-processo','f-vencimento'].forEach(id => (document.getElementById(id).value = ''));
      ['f-sistema','f-instancia','f-tipo','f-login','f-nivel'].forEach(id => (document.getElementById(id).selectedIndex = 0));
    }

    function overlayClick(e) { if (e.target === document.getElementById('overlay')) closeModal(); }

    async function submitForm() {
      const cliente  = document.getElementById('f-cliente').value.trim();
      const processo = document.getElementById('f-processo').value.trim();
      if (!cliente || !processo) { toast('Cliente e processo sao obrigatorios.', 'err'); return; }

      const btn = document.getElementById('btn-save');
      btn.disabled = true; btn.textContent = 'Salvando...';

      try {
        await insertRow({
          cliente, processo,
          sistema:    document.getElementById('f-sistema').value    || null,
          instancia:  document.getElementById('f-instancia').value  || null,
          tipo:       document.getElementById('f-tipo').value       || null,
          vencimento: document.getElementById('f-vencimento').value || null,
          login:      document.getElementById('f-login').value      || null,
          nivel:      document.getElementById('f-nivel').value      || null,
          concluido:  false,
        });
        toast('Prazo salvo com sucesso.', 'ok');
        closeModal();
        await loadRows();
      } catch (e) {
        toast('Erro ao salvar: ' + e.message, 'err');
      } finally {
        btn.disabled = false; btn.textContent = 'Salvar Prazo';
      }
    }

    // ── Sidebar ──────────────────────────────────────────────────
    let sidebarOpen = false;

    function openSidebar() {
      sidebarOpen = true;
      document.getElementById('sidebar').style.transform = 'translateX(0)';
      if (window.innerWidth < 1024) {
        document.getElementById('sidebar-overlay').classList.remove('hidden');
      } else {
        document.getElementById('main-wrap').style.marginLeft = '256px';
      }
    }

    function closeSidebar() {
      sidebarOpen = false;
      document.getElementById('sidebar').style.transform = 'translateX(-100%)';
      document.getElementById('sidebar-overlay').classList.add('hidden');
      document.getElementById('main-wrap').style.marginLeft = '0';
    }

    function toggleSidebar() { sidebarOpen ? closeSidebar() : openSidebar(); }

    window.addEventListener('resize', () => {
      if (window.innerWidth >= 1024) {
        document.getElementById('sidebar-overlay').classList.add('hidden');
        if (sidebarOpen) document.getElementById('main-wrap').style.marginLeft = '256px';
      } else {
        document.getElementById('main-wrap').style.marginLeft = '0';
      }
    });

    // ── Toast ────────────────────────────────────────────────────
    let _tt;
    function toast(msg, type = 'ok') {
      const el  = document.getElementById('toast');
      el.textContent = msg;
      const cls = type === 'ok'
        ? 'bg-white border border-green-300 text-green-700 border-l-4 border-l-green-500 shadow-lg rounded-xl px-4 py-3 text-sm font-medium max-w-xs pointer-events-none opacity-100 translate-y-0 transition-all duration-300 fixed bottom-6 right-6 z-50'
        : 'bg-white border border-red-300 text-red-700 border-l-4 border-l-red-500 shadow-lg rounded-xl px-4 py-3 text-sm font-medium max-w-xs pointer-events-none opacity-100 translate-y-0 transition-all duration-300 fixed bottom-6 right-6 z-50';
      el.className = cls;
      clearTimeout(_tt);
      _tt = setTimeout(() => { el.className = el.className.replace('opacity-100 translate-y-0','opacity-0 translate-y-2'); }, 3200);
    }

    // ── Util ─────────────────────────────────────────────────────
    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── Keyboard ─────────────────────────────────────────────────
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    // ── Boot ─────────────────────────────────────────────────────
    if (window.innerWidth >= 1024) openSidebar();
    syncBtns();
    loadRows();
  </script>
</body>
</html>
