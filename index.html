<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EQUILIBJUS // CONTROLE OPERACIONAL</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ── Reset ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Tokens ─────────────────────────────────────────── */
    :root {
      --bg:     #06060A;
      --card:   #0C0C12;
      --border: #1C1C26;
      --text:   #D8D4CC;
      --muted:  #44445A;
      --green:  #00FF41;
      --red:    #FF3333;
      --amber:  #FFB020;
      --blue:   #4A9EFF;
      --gray:   #4A4A5E;
      --hover:  #121218;
      --mono:   'JetBrains Mono', monospace;
      --ui:     'Space Grotesk', sans-serif;
    }

    /* ── Base ────────────────────────────────────────────── */
    html { height: 100%; }

    body {
      font-family: var(--ui);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      position: relative;
    }

    /* ── Scanlines ───────────────────────────────────────── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 255, 65, 0.007) 0px,
        rgba(0, 255, 65, 0.007) 1px,
        transparent 1px,
        transparent 2px
      );
    }

    /* ── Scrollbar ───────────────────────────────────────── */
    ::-webkit-scrollbar { width: 3px; height: 3px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #262634; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    /* ── Animations ──────────────────────────────────────── */
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; box-shadow: 0 0 5px var(--green), 0 0 10px rgba(0,255,65,.3); }
      50%       { opacity: .5; box-shadow: 0 0 2px var(--green); }
    }
    @keyframes sidebar-glow {
      0%, 100% { box-shadow: 1px 0 0 0 var(--border), 2px 0 12px rgba(0,255,65,.04); }
      50%       { box-shadow: 1px 0 0 0 var(--border), 2px 0 24px rgba(0,255,65,.10); }
    }
    @keyframes blink-cursor {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* ══════════════════════════════════════════════════
       SIDEBAR
    ══════════════════════════════════════════════════ */
    #sidebar {
      position: fixed;
      top: 0; left: 0;
      width: 224px;
      height: 100%;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      z-index: 300;
      animation: sidebar-glow 4s ease-in-out infinite;
      transform: translateX(-100%);
      transition: transform .3s ease;
    }

    /* ── Sidebar brand ────────────────────────────────── */
    .sb-brand {
      padding: 20px 18px 16px;
      border-bottom: 1px solid var(--border);
    }
    .sb-logo {
      font-family: var(--mono);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: .18em;
      color: var(--green);
      text-shadow: 0 0 10px rgba(0,255,65,.4);
    }
    .sb-subtitle {
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: .12em;
      color: var(--muted);
      margin-top: 3px;
      text-transform: uppercase;
    }
    .sb-status {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
    }
    .dot-online {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse-dot 2.4s ease-in-out infinite;
      flex-shrink: 0;
    }
    .sb-status-text {
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: .14em;
      color: var(--green);
      text-transform: uppercase;
    }

    /* ── Sidebar nav ──────────────────────────────────── */
    .sb-nav {
      flex: 1;
      padding: 10px 10px;
      overflow-y: auto;
    }
    .sb-nav-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 10px;
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .04em;
      color: var(--muted);
      text-decoration: none;
      border: 1px solid transparent;
      transition: all .15s;
      cursor: pointer;
    }
    .sb-nav-item:hover {
      color: var(--text);
      background: var(--card);
      border-color: var(--border);
    }
    .sb-nav-item.active {
      color: var(--green);
      background: rgba(0,255,65,.05);
      border-color: rgba(0,255,65,.18);
      text-shadow: 0 0 8px rgba(0,255,65,.3);
    }
    .sb-nav-item.active svg { filter: drop-shadow(0 0 3px rgba(0,255,65,.5)); }

    /* ── Sidebar footer ───────────────────────────────── */
    .sb-footer {
      padding: 12px 18px;
      border-top: 1px solid var(--border);
    }
    .sb-ver {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--muted);
      letter-spacing: .08em;
    }

    /* ══════════════════════════════════════════════════
       OVERLAY (mobile sidebar)
    ══════════════════════════════════════════════════ */
    #sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      z-index: 200;
      display: none;
    }

    /* ══════════════════════════════════════════════════
       MAIN WRAP
    ══════════════════════════════════════════════════ */
    #main-wrap {
      margin-left: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: margin-left .3s ease;
    }

    /* ══════════════════════════════════════════════════
       TOPBAR
    ══════════════════════════════════════════════════ */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 44px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
    }
    .topbar-hamburger {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      width: 28px; height: 28px;
      border-radius: 3px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all .15s;
      flex-shrink: 0;
    }
    .topbar-hamburger:hover { border-color: var(--green); color: var(--green); }

    .topbar-title {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .14em;
      color: var(--text);
      text-transform: uppercase;
      flex: 1;
    }
    .topbar-title span {
      font-size: 11px;
      animation: blink-cursor 1.2s step-end infinite;
      color: var(--green);
      margin-left: 2px;
    }

    .topbar-search {
      display: flex;
      align-items: center;
      gap: 7px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 0 10px;
      height: 28px;
      width: 220px;
      transition: border-color .15s;
    }
    .topbar-search:focus-within { border-color: rgba(0,255,65,.35); }
    .topbar-search svg { color: var(--muted); flex-shrink: 0; }
    .topbar-search input {
      background: none;
      border: none;
      outline: none;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text);
      width: 100%;
      letter-spacing: .04em;
    }
    .topbar-search input::placeholder { color: var(--muted); }

    .topbar-clock {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: .08em;
      flex-shrink: 0;
    }

    .btn-new {
      background: rgba(0,255,65,.07);
      border: 1px solid rgba(0,255,65,.3);
      color: var(--green);
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .1em;
      padding: 0 12px;
      height: 28px;
      border-radius: 3px;
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      transition: all .15s;
      flex-shrink: 0;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(0,255,65,.3);
    }
    .btn-new:hover {
      background: rgba(0,255,65,.14);
      border-color: var(--green);
      box-shadow: 0 0 12px rgba(0,255,65,.15);
    }

    /* ══════════════════════════════════════════════════
       CONTENT
    ══════════════════════════════════════════════════ */
    .content { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

    /* Search mobile */
    .search-mobile {
      display: none;
      align-items: center;
      gap: 7px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 0 10px;
      height: 32px;
    }
    .search-mobile:focus-within { border-color: rgba(0,255,65,.35); }
    .search-mobile svg { color: var(--muted); flex-shrink: 0; }
    .search-mobile input {
      background: none; border: none; outline: none;
      font-family: var(--mono); font-size: 10px; color: var(--text); width: 100%;
    }
    .search-mobile input::placeholder { color: var(--muted); }

    /* ── Metrics grid ─────────────────────────────────── */
    .metrics {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .metric-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 12px 14px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      position: relative;
      overflow: hidden;
      user-select: none;
    }
    .metric-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
    }
    .metric-card[data-nivel="fatal"]::before,
    .metric-card[data-nivel="critico"]::before { background: var(--red); }
    .metric-card[data-nivel="atencao"]::before { background: var(--amber); }
    .metric-card[data-nivel="no_prazo"]::before { background: var(--blue); }
    .metric-card[data-nivel="aguardando"]::before { background: var(--gray); }

    .metric-card:hover { background: var(--hover); border-color: rgba(255,255,255,.08); }
    .metric-card.selected { border-color: rgba(0,255,65,.25); background: rgba(0,255,65,.03); }

    .metric-label {
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 500;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .metric-value {
      font-family: var(--mono);
      font-size: 32px;
      font-weight: 700;
      line-height: 1;
    }
    .metric-card[data-nivel="fatal"]      .metric-value,
    .metric-card[data-nivel="critico"]    .metric-value { color: var(--red); text-shadow: 0 0 12px rgba(255,51,51,.3); }
    .metric-card[data-nivel="atencao"]    .metric-value { color: var(--amber); text-shadow: 0 0 12px rgba(255,176,32,.25); }
    .metric-card[data-nivel="no_prazo"]   .metric-value { color: var(--blue); text-shadow: 0 0 12px rgba(74,158,255,.25); }
    .metric-card[data-nivel="aguardando"] .metric-value { color: var(--gray); }

    /* ── Filter panel ─────────────────────────────────── */
    .filter-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .filter-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .filter-label {
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
      width: 64px;
      flex-shrink: 0;
    }
    .filter-group { display: flex; gap: 4px; flex-wrap: wrap; }
    .fbtn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 2px;
      cursor: pointer;
      transition: all .12s;
    }
    .fbtn:hover { border-color: rgba(255,255,255,.15); color: var(--text); }
    .fbtn.on {
      background: rgba(0,255,65,.06);
      border-color: rgba(0,255,65,.3);
      color: var(--green);
      text-shadow: 0 0 6px rgba(0,255,65,.3);
    }

    .filter-sep { width: 1px; height: 16px; background: var(--border); flex-shrink: 0; }

    /* Toggle */
    .toggle-wrap { display: flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; margin-left: auto; }
    .toggle-wrap input { display: none; }
    .toggle-track {
      width: 32px; height: 16px;
      background: var(--border);
      border-radius: 16px;
      position: relative;
      transition: background .2s;
      cursor: pointer;
    }
    .toggle-thumb {
      position: absolute;
      top: 2px; left: 2px;
      width: 12px; height: 12px;
      background: var(--muted);
      border-radius: 50%;
      transition: transform .2s, background .2s;
    }
    .toggle-wrap input:checked ~ .toggle-track { background: rgba(0,255,65,.2); border: 1px solid rgba(0,255,65,.3); }
    .toggle-wrap input:checked ~ .toggle-track .toggle-thumb {
      transform: translateX(16px);
      background: var(--green);
      box-shadow: 0 0 6px rgba(0,255,65,.5);
    }
    .toggle-text {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Table ────────────────────────────────────────── */
    .table-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 3px;
      overflow: hidden;
      overflow-x: auto;
      flex: 1;
    }
    table { width: 100%; border-collapse: collapse; }
    thead { border-bottom: 1px solid var(--border); }
    th {
      text-align: left;
      padding: 9px 14px;
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
      background: var(--bg);
    }
    td {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(28,28,38,.8);
      vertical-align: middle;
      font-size: 12px;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--hover); }

    .td-client {
      font-family: var(--ui);
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      max-width: 200px;
    }
    .td-client span { display: block; overflow: hidden; text-overflow: ellipsis; }

    .td-process {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--blue);
      white-space: nowrap;
      letter-spacing: .02em;
    }

    .td-muted {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
    }

    .td-venc { white-space: nowrap; }
    .venc-date {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
    }
    .venc-delta {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--muted);
      margin-top: 1px;
      letter-spacing: .04em;
    }
    .venc-date.fatal,
    .venc-date.critico   { color: var(--red);   text-shadow: 0 0 8px rgba(255,51,51,.3); }
    .venc-date.atencao   { color: var(--amber); }
    .venc-date.no_prazo  { color: var(--blue);  }
    .venc-date.aguardando{ color: var(--muted); }

    /* ── Badges ─────────────────────────────────────────── */
    .badge {
      display: inline-block;
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 2px;
      border: 1px solid;
      white-space: nowrap;
    }
    .badge.fatal,
    .badge.critico   { background: rgba(255,51,51,.08);  border-color: rgba(255,51,51,.3);  color: var(--red);   }
    .badge.atencao   { background: rgba(255,176,32,.08); border-color: rgba(255,176,32,.3); color: var(--amber); }
    .badge.no_prazo  { background: rgba(74,158,255,.08); border-color: rgba(74,158,255,.3); color: var(--blue);  }
    .badge.aguardando{ background: rgba(74,74,94,.1);    border-color: rgba(74,74,94,.4);   color: var(--gray);  }

    /* ── Action button ──────────────────────────────────── */
    .btn-done {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 2px;
      cursor: pointer;
      transition: all .12s;
      white-space: nowrap;
    }
    .btn-done:hover {
      border-color: rgba(0,255,65,.35);
      color: var(--green);
      background: rgba(0,255,65,.05);
      text-shadow: 0 0 6px rgba(0,255,65,.3);
    }
    .done-tag {
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--green);
      text-shadow: 0 0 6px rgba(0,255,65,.3);
    }

    /* ── Empty / state ──────────────────────────────────── */
    .state-cell { padding: 48px 16px; text-align: center; }
    .state-title { font-family: var(--mono); font-size: 11px; color: var(--text); letter-spacing: .08em; margin-bottom: 4px; }
    .state-desc  { font-family: var(--mono); font-size: 9px; color: var(--muted); letter-spacing: .06em; }

    /* ══════════════════════════════════════════════════
       MODAL
    ══════════════════════════════════════════════════ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.82);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 400;
      padding: 16px;
      opacity: 0;
      visibility: hidden;
      transition: opacity .2s, visibility .2s;
    }
    .modal-overlay.open { opacity: 1; visibility: visible; }

    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 3px;
      width: 100%;
      max-width: 520px;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      transform: translateY(10px);
      transition: transform .2s;
      box-shadow: 0 0 40px rgba(0,0,0,.8), 0 0 1px var(--green) inset;
    }
    .modal-overlay.open .modal { transform: translateY(0); }

    .modal-hd {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-title {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--text);
    }
    .modal-close {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      width: 24px; height: 24px;
      border-radius: 2px;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 12px;
      display: flex; align-items: center; justify-content: center;
      transition: all .12s;
    }
    .modal-close:hover { border-color: var(--red); color: var(--red); }

    .modal-body { padding: 18px; overflow-y: auto; flex: 1; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .fg { display: flex; flex-direction: column; gap: 5px; }
    .fg.span2 { grid-column: 1 / -1; }

    .fg label {
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .fg input,
    .fg select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 11px;
      padding: 8px 10px;
      border-radius: 2px;
      outline: none;
      transition: border-color .12s;
      width: 100%;
      letter-spacing: .02em;
    }
    .fg input:focus,
    .fg select:focus { border-color: rgba(0,255,65,.4); box-shadow: 0 0 0 1px rgba(0,255,65,.1); }
    .fg input::placeholder { color: var(--muted); }
    .fg select option { background: var(--card); color: var(--text); }

    .modal-ft {
      padding: 12px 18px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      background: var(--bg);
    }
    .btn-cancel {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 7px 16px;
      border-radius: 2px;
      cursor: pointer;
      transition: all .12s;
    }
    .btn-cancel:hover { border-color: var(--muted); color: var(--text); }
    .btn-save {
      background: rgba(0,255,65,.08);
      border: 1px solid rgba(0,255,65,.35);
      color: var(--green);
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 7px 20px;
      border-radius: 2px;
      cursor: pointer;
      transition: all .12s;
      text-shadow: 0 0 8px rgba(0,255,65,.3);
    }
    .btn-save:hover {
      background: rgba(0,255,65,.15);
      border-color: var(--green);
      box-shadow: 0 0 14px rgba(0,255,65,.15);
    }
    .btn-save:disabled { opacity: .4; cursor: not-allowed; }

    /* ══════════════════════════════════════════════════
       TOAST
    ══════════════════════════════════════════════════ */
    .toast {
      position: fixed;
      bottom: 20px; right: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .06em;
      padding: 10px 14px;
      border-radius: 3px;
      z-index: 500;
      max-width: 300px;
      transform: translateY(10px);
      opacity: 0;
      transition: all .25s;
      pointer-events: none;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.ok   { border-left: 2px solid var(--green); }
    .toast.err  { border-left: 2px solid var(--red); }

    /* ══════════════════════════════════════════════════
       RESPONSIVE
    ══════════════════════════════════════════════════ */
    @media (max-width: 1023px) {
      .topbar-search { display: none; }
      .search-mobile { display: flex; }
    }
    @media (max-width: 900px) {
      .metrics { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 600px) {
      .metrics { grid-template-columns: repeat(2, 1fr); }
      .form-grid { grid-template-columns: 1fr; }
      .fg.span2 { grid-column: 1; }
      .content { padding: 10px; }
      th:nth-child(3), td:nth-child(3),
      th:nth-child(4), td:nth-child(4),
      th:nth-child(5), td:nth-child(5) { display: none; }
    }
  </style>
</head>

<body>

  <!-- Sidebar overlay (mobile) -->
  <div id="sidebar-overlay" onclick="closeSidebar()"></div>

  <!-- ══════════════════════════════════════════════
       SIDEBAR
  ══════════════════════════════════════════════ -->
  <aside id="sidebar">

    <div class="sb-brand">
      <div class="sb-logo">EQUILIBJUS</div>
      <div class="sb-subtitle">Controle Operacional</div>
      <div class="sb-status">
        <div class="dot-online"></div>
        <span class="sb-status-text">Online</span>
      </div>
    </div>

    <nav class="sb-nav">
      <a class="sb-nav-item active">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
        Prazos Processuais
      </a>
    </nav>

    <div class="sb-footer">
      <div class="sb-ver">SYS v1.0.0</div>
    </div>

  <!-- ══════════════════════════════════════════════
       MAIN WRAP
  ══════════════════════════════════════════════ -->
  <div id="main-wrap">

    <!-- TOPBAR -->
    <header class="topbar">
      <button class="topbar-hamburger" onclick="toggleSidebar()" aria-label="Menu">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>

      <div class="topbar-title">
        Prazos Processuais<span>_</span>
      </div>

      <div class="topbar-search">
        <svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input id="search" type="text" placeholder="buscar cliente ou processo..."
               oninput="onSearch(this.value)">
      </div>

      <div class="topbar-clock" id="clock">--:--:--</div>

      <button class="btn-new" onclick="openModal()">
        <svg width="10" height="10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
        </svg>
        <span class="hidden-xs">Novo Prazo</span>
      </button>
    </header>

    <!-- CONTENT -->
    <div class="content">

      <!-- Search mobile -->
      <div class="search-mobile">
        <svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input type="text" placeholder="buscar cliente ou processo..."
               oninput="document.getElementById('search').value=this.value; onSearch(this.value)">
      </div>

      <!-- METRICS -->
      <div class="metrics">
        <div class="metric-card" data-nivel="fatal" onclick="clickMetric('fatal')">
          <div class="metric-label">Fatal</div>
          <div class="metric-value" id="cnt-fatal">-</div>
        </div>
        <div class="metric-card" data-nivel="critico" onclick="clickMetric('critico')">
          <div class="metric-label">Critico</div>
          <div class="metric-value" id="cnt-critico">-</div>
        </div>
        <div class="metric-card" data-nivel="atencao" onclick="clickMetric('atencao')">
          <div class="metric-label">Atencao</div>
          <div class="metric-value" id="cnt-atencao">-</div>
        </div>
        <div class="metric-card" data-nivel="no_prazo" onclick="clickMetric('no_prazo')">
          <div class="metric-label">Em Dia</div>
          <div class="metric-value" id="cnt-no_prazo">-</div>
        </div>
        <div class="metric-card" data-nivel="aguardando" onclick="clickMetric('aguardando')">
          <div class="metric-label">Aguardando</div>
          <div class="metric-value" id="cnt-aguardando">-</div>
        </div>
      </div>

      <!-- FILTERS -->
      <div class="filter-panel">
        <div class="filter-row">
          <span class="filter-label">Urgencia</span>
          <div class="filter-group" id="fg-nivel">
            <button class="fbtn" data-v="todos"      onclick="setNivel('todos')">Todos</button>
            <button class="fbtn" data-v="fatal"      onclick="setNivel('fatal')">Fatal</button>
            <button class="fbtn" data-v="critico"    onclick="setNivel('critico')">Critico</button>
            <button class="fbtn" data-v="atencao"    onclick="setNivel('atencao')">Atencao</button>
            <button class="fbtn" data-v="no_prazo"   onclick="setNivel('no_prazo')">Em Dia</button>
            <button class="fbtn" data-v="aguardando" onclick="setNivel('aguardando')">Aguardando</button>
          </div>
        </div>
        <div class="filter-row">
          <span class="filter-label">Responsavel</span>
          <div class="filter-group" id="fg-adv">
            <button class="fbtn" data-v="todos"   onclick="setAdv('todos')">Todos</button>
            <button class="fbtn" data-v="Ricardo" onclick="setAdv('Ricardo')">Ricardo</button>
            <button class="fbtn" data-v="Athos"   onclick="setAdv('Athos')">Athos</button>
            <button class="fbtn" data-v="Romulo"  onclick="setAdv('Romulo')">Romulo</button>
          </div>
          <div class="filter-sep"></div>
          <label class="toggle-wrap">
            <input type="checkbox" id="tog-conc" onchange="onToggleConc()">
            <div class="toggle-track"><div class="toggle-thumb"></div></div>
            <span class="toggle-text">Concluidos</span>
          </label>
        </div>
      </div>

      <!-- TABLE -->
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Cliente</th>
              <th>Processo</th>
              <th>Sistema</th>
              <th>Instancia</th>
              <th>Tipo</th>
              <th>Vencimento</th>
              <th>Responsavel</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="9"><div class="state-cell"><div class="state-desc">// carregando registros...</div></div></td></tr>
          </tbody>
        </table>
      </div>

    </div><!-- /content -->
  </div><!-- /main-wrap -->

  <!-- ══════════════════════════════════════════════
       MODAL
  ══════════════════════════════════════════════ -->
  <div class="modal-overlay" id="modal-overlay" onclick="overlayClick(event)">
    <div class="modal">
      <div class="modal-hd">
        <div class="modal-title">// Novo Prazo</div>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="fg span2">
            <label>Cliente</label>
            <input type="text" id="f-cliente" placeholder="nome do cliente">
          </div>
          <div class="fg span2">
            <label>Numero do Processo</label>
            <input type="text" id="f-processo" placeholder="0000000-00.0000.0.00.0000">
          </div>
          <div class="fg">
            <label>Sistema</label>
            <select id="f-sistema">
              <option value="">-- selecionar</option>
              <option>PJe</option>
              <option>e-SAJ</option>
              <option>PROJUDI</option>
              <option>EPROC</option>
              <option>CRETA</option>
              <option>Themis</option>
              <option>eproc TJTO</option>
              <option>PJE1 TRF1</option>
              <option>PJE2 TRF1</option>
              <option>Outros</option>
            </select>
          </div>
          <div class="fg">
            <label>Instancia</label>
            <select id="f-instancia">
              <option value="">-- selecionar</option>
              <option>1 Instancia</option>
              <option>2 Instancia</option>
              <option>TJ / TRF</option>
              <option>STJ</option>
              <option>STF</option>
              <option>TST</option>
              <option>Arbitragem</option>
              <option>Extrajudicial</option>
            </select>
          </div>
          <div class="fg">
            <label>Tipo de Prazo</label>
            <select id="f-tipo">
              <option value="">-- selecionar</option>
              <option>Recurso</option>
              <option>Contestacao</option>
              <option>Peticao</option>
              <option>Manifestacao</option>
              <option>Impugnacao</option>
              <option>Replica</option>
              <option>Memoriais</option>
              <option>Sustentacao Oral</option>
              <option>Acordo</option>
              <option>Intimacao eletronica</option>
              <option>Decisao</option>
              <option>Despacho Decisao</option>
              <option>Outros</option>
            </select>
          </div>
          <div class="fg">
            <label>Vencimento</label>
            <input type="date" id="f-vencimento">
          </div>
          <div class="fg">
            <label>Responsavel</label>
            <select id="f-login">
              <option value="">-- selecionar</option>
              <option value="Ricardo">Ricardo</option>
              <option value="Athos">Athos</option>
              <option value="Romulo">Romulo</option>
              <option value="Athos e Rômulo">Athos e Romulo</option>
              <option value="Todos">Todos</option>
            </select>
          </div>
          <div class="fg">
            <label>Urgencia</label>
            <select id="f-nivel">
              <option value="">automatico (por data)</option>
              <option value="aguardando">Aguardando</option>
            </select>
          </div>
        </div>
      </div>
      <div class="modal-ft">
        <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
        <button class="btn-save" id="btn-save" onclick="submitForm()">Salvar Prazo</button>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast" role="alert" aria-live="polite"></div>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    'use strict';

    // ============================================================
    // CONFIGURACAO — edite as constantes abaixo conforme necessario
    // ============================================================
    const SUPABASE_URL      = 'https://nuelqfvnjacnbctodreg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_rlgOc-_O890oEgzVjInQZg_ep4fmqbO';
    // ============================================================

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ── Estado ──────────────────────────────────────────────────
    let rows      = [];
    let fNivel    = 'todos';
    let fAdv      = 'todos';
    let searchStr = '';
    let showConc  = false;

    // ── Urgencia ─────────────────────────────────────────────────
    function calcNivel(p) {
      if (p.nivel === 'aguardando') return 'aguardando';
      if (!p.vencimento)            return 'aguardando';
      const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
      const venc = new Date(p.vencimento + 'T00:00:00');
      const d    = Math.floor((venc - hoje) / 86400000);
      if (d < 0)  return 'fatal';
      if (d <= 2) return 'critico';
      if (d <= 5) return 'atencao';
      return 'no_prazo';
    }

    const NIVEL_LABEL = {
      fatal:'VENCIDO', critico:'CRITICO', atencao:'ATENCAO',
      no_prazo:'EM DIA', aguardando:'AGUARDANDO'
    };

    function deltaLabel(p) {
      if (!p.vencimento || p.nivel === 'aguardando') return '';
      const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
      const venc = new Date(p.vencimento + 'T00:00:00');
      const d    = Math.floor((venc - hoje) / 86400000);
      if (d < 0)   return '+' + Math.abs(d) + 'd';
      if (d === 0) return 'hoje';
      if (d === 1) return 'amanha';
      return d + 'd';
    }

    function fmtDate(iso) {
      if (!iso) return '---';
      const [y, m, d] = iso.split('-');
      return d + '/' + m + '/' + y;
    }

    // ── loadRows ─────────────────────────────────────────────────
    async function loadRows() {
      try {
        let q = db.from('prazos').select('*')
                  .order('vencimento', { ascending: true, nullsFirst: false });
        if (!showConc) q = q.or('concluido.is.null,concluido.eq.false');
        const { data, error } = await q;
        if (error) throw error;
        rows = data || [];
        render();
      } catch (e) {
        console.error(e);
        toast('ERR: ' + e.message, 'err');
        document.getElementById('tbody').innerHTML =
          `<tr><td colspan="9"><div class="state-cell">
            <div class="state-title">// connection error</div>
            <div class="state-desc">${esc(e.message)}</div>
          </div></td></tr>`;
      }
    }

    // ── insertRow ────────────────────────────────────────────────
    async function insertRow(payload) {
      const { error } = await db.from('prazos').insert([payload]);
      if (error) throw error;
    }

    // ── markDone ─────────────────────────────────────────────────
    async function markDone(id) {
      const { error } = await db.from('prazos').update({ concluido: true }).eq('id', id);
      if (error) throw error;
    }

    // ── Filtros ──────────────────────────────────────────────────
    function filtered() {
      return rows.filter(p => {
        const n = calcNivel(p);
        if (fNivel !== 'todos' && n !== fNivel) return false;
        if (fAdv !== 'todos') {
          const login = (p.login || '').toLowerCase();
          if (!login.includes(fAdv.toLowerCase()) && login !== 'todos') return false;
        }
        if (searchStr) {
          const t = searchStr.toLowerCase();
          if (!(p.cliente  || '').toLowerCase().includes(t) &&
              !(p.processo || '').toLowerCase().includes(t)) return false;
        }
        return true;
      });
    }

    // ── Render metricas ───────────────────────────────────────────
    function renderMetrics() {
      const base   = rows.filter(p => !p.concluido);
      const counts = { fatal:0, critico:0, atencao:0, no_prazo:0, aguardando:0 };
      base.forEach(p => { const n = calcNivel(p); if (n in counts) counts[n]++; });
      for (const [k, v] of Object.entries(counts)) {
        const el = document.getElementById('cnt-' + k);
        if (el) el.textContent = v;
      }
    }

    // ── Render tabela ─────────────────────────────────────────────
    function renderTable() {
      const data  = filtered();
      const tbody = document.getElementById('tbody');
      if (!data.length) {
        tbody.innerHTML = `
          <tr><td colspan="9"><div class="state-cell">
            <div class="state-title">// sem registros</div>
            <div class="state-desc">ajuste os filtros ou adicione um novo prazo</div>
          </div></td></tr>`;
        return;
      }
      tbody.innerHTML = data.map(p => {
        const n     = calcNivel(p);
        const delta = deltaLabel(p);
        const done  = !!p.concluido;
        return `
          <tr style="${done ? 'opacity:.4' : ''}">
            <td class="td-client"><span title="${esc(p.cliente||'')}">${esc(p.cliente||'---')}</span></td>
            <td class="td-process">${esc(p.processo||'---')}</td>
            <td class="td-muted">${esc(p.sistema||'---')}</td>
            <td class="td-muted">${esc(p.instancia||'---')}</td>
            <td class="td-muted" style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.tipo||'---')}</td>
            <td class="td-venc">
              <div class="venc-date ${n}">${fmtDate(p.vencimento)}</div>
              ${delta ? `<div class="venc-delta">${delta}</div>` : ''}
            </td>
            <td class="td-muted">${esc(p.login||'---')}</td>
            <td><span class="badge ${n}">${NIVEL_LABEL[n]}</span></td>
            <td style="text-align:right">
              ${done
                ? `<span class="done-tag">&#10003; OK</span>`
                : `<button class="btn-done" onclick="handleConcluir('${esc(p.id)}')">Concluir</button>`
              }
            </td>
          </tr>`;
      }).join('');
    }

    function render() { renderMetrics(); renderTable(); syncBtns(); }

    // ── Sync filtros ──────────────────────────────────────────────
    function syncBtns() {
      document.querySelectorAll('#fg-nivel .fbtn').forEach(b =>
        b.classList.toggle('on', b.dataset.v === fNivel));
      document.querySelectorAll('#fg-adv .fbtn').forEach(b =>
        b.classList.toggle('on', b.dataset.v === fAdv));
      document.querySelectorAll('.metric-card').forEach(c =>
        c.classList.toggle('selected', c.dataset.nivel === fNivel));
    }

    function setNivel(v) { fNivel = v; syncBtns(); renderTable(); }
    function setAdv(v)   { fAdv   = v; syncBtns(); renderTable(); }
    function clickMetric(nivel) { setNivel(fNivel === nivel ? 'todos' : nivel); }
    function onSearch(v) { searchStr = v; renderTable(); }

    async function onToggleConc() {
      showConc = document.getElementById('tog-conc').checked;
      await loadRows();
    }

    async function handleConcluir(id) {
      try {
        await markDone(id);
        toast('Prazo concluido.', 'ok');
        await loadRows();
      } catch (e) {
        toast('ERR: ' + e.message, 'err');
      }
    }

    // ── Modal ────────────────────────────────────────────────────
    function openModal() {
      document.getElementById('modal-overlay').classList.add('open');
      document.getElementById('f-cliente').focus();
    }
    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('open');
      ['f-cliente','f-processo','f-vencimento'].forEach(id => (document.getElementById(id).value = ''));
      ['f-sistema','f-instancia','f-tipo','f-login','f-nivel'].forEach(id => (document.getElementById(id).selectedIndex = 0));
    }
    function overlayClick(e) { if (e.target === document.getElementById('modal-overlay')) closeModal(); }

    async function submitForm() {
      const cliente  = document.getElementById('f-cliente').value.trim();
      const processo = document.getElementById('f-processo').value.trim();
      if (!cliente || !processo) { toast('ERR: cliente e processo obrigatorios', 'err'); return; }
      const btn = document.getElementById('btn-save');
      btn.disabled = true; btn.textContent = 'Salvando...';
      try {
        await insertRow({
          cliente, processo,
          sistema:    document.getElementById('f-sistema').value    || null,
          instancia:  document.getElementById('f-instancia').value  || null,
          tipo:       document.getElementById('f-tipo').value       || null,
          vencimento: document.getElementById('f-vencimento').value || null,
          login:      document.getElementById('f-login').value      || null,
          nivel:      document.getElementById('f-nivel').value      || null,
          concluido:  false,
        });
        toast('Registro inserido.', 'ok');
        closeModal();
        await loadRows();
      } catch (e) {
        toast('ERR: ' + e.message, 'err');
      } finally {
        btn.disabled = false; btn.textContent = 'Salvar Prazo';
      }
    }

    // ── Sidebar ──────────────────────────────────────────────────
    let sidebarOpen = false;

    function openSidebar() {
      sidebarOpen = true;
      document.getElementById('sidebar').style.transform = 'translateX(0)';
      if (window.innerWidth >= 1024) {
        document.getElementById('main-wrap').style.marginLeft = '224px';
      } else {
        document.getElementById('sidebar-overlay').style.display = 'block';
      }
    }
    function closeSidebar() {
      sidebarOpen = false;
      document.getElementById('sidebar').style.transform = 'translateX(-100%)';
      document.getElementById('sidebar-overlay').style.display = 'none';
      document.getElementById('main-wrap').style.marginLeft = '0';
    }
    function toggleSidebar() { sidebarOpen ? closeSidebar() : openSidebar(); }

    window.addEventListener('resize', () => {
      if (window.innerWidth >= 1024) {
        document.getElementById('sidebar-overlay').style.display = 'none';
        if (sidebarOpen) document.getElementById('main-wrap').style.marginLeft = '224px';
      } else {
        document.getElementById('main-wrap').style.marginLeft = '0';
      }
    });

    // ── Relogio ──────────────────────────────────────────────────
    function updateClock() {
      document.getElementById('clock').textContent =
        new Date().toLocaleTimeString('pt-BR', { hour12: false });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ── Toast ────────────────────────────────────────────────────
    let _tt;
    function toast(msg, type = 'ok') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = `toast ${type} show`;
      clearTimeout(_tt);
      _tt = setTimeout(() => { el.classList.remove('show'); }, 3200);
    }

    // ── Util ─────────────────────────────────────────────────────
    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── Keyboard ─────────────────────────────────────────────────
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    // ── Boot ─────────────────────────────────────────────────────
    if (window.innerWidth >= 1024) openSidebar();
    syncBtns();
    loadRows();
  </script>
